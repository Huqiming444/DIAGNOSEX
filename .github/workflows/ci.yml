name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile DIAGNOSEX.py

      - name: Data integrity check
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("中药上市公司2023-2025年报财务数据.csv", encoding="utf-8-sig")
          required = ["代码", "名称", "年份", "营业收入(亿元)", "归母净利润(亿元)",
                      "毛利率(%)", "净利率(%)", "ROE(%)", "资产负债率(%)", "研发费用率(%)"]
          missing = [c for c in required if c not in df.columns]
          assert not missing, f"缺少字段: {missing}"
          assert len(df) == 204, f"记录数应为 204，实际 {len(df)}"
          assert df["名称"].nunique() == 68, f"公司数应为 68，实际 {df['名称'].nunique()}"
          assert sorted(df["年份"].unique().tolist()) == [2023, 2024, 2025], "年份应为 2023-2025"
          print(f"数据校验通过：{df['名称'].nunique()} 家公司 / {len(df)} 条记录")
          PY

      - name: Start Streamlit and smoke test
        shell: bash
        run: |
          python -m streamlit run DIAGNOSEX.py \
            --server.headless true --server.port 8502 \
            --theme.base light --browser.gatherUsageStats false > streamlit.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8502 || true)
            if [ "$code" = "200" ]; then
              echo "✅ 服务启动成功，HTTP 200"
              exit 0
            fi
            sleep 2
          done
          echo "❌ 服务启动失败，日志如下："
          cat streamlit.log
          exit 1
